# RTAB-Map Configuration for x500_depth with OAK-D Camera
# This file contains parameter descriptions and tuning guidance

# ==============================================================================
# Core SLAM Parameters
# ==============================================================================

# Frame IDs
frame_id: "base_link"           # Robot base frame
odom_frame_id: "odom"           # Odometry frame
map_frame_id: "map"             # Map frame

# Topic subscriptions
subscribe_depth: true           # Subscribe to depth image
subscribe_rgb: true             # Subscribe to RGB image
subscribe_scan_cloud: true      # Subscribe to point cloud

# TF and timing
publish_tf: true                # Publish TF transforms
wait_for_transform: 0.5         # Wait time for TF lookup (seconds)
queue_size: 30                  # Message queue size

# ==============================================================================
# RTAB-Map Core Parameters
# ==============================================================================

# Detection and processing
Rtabmap/DetectionRate: "2.0"    # Hz - Process N frames per second (1.0-5.0)
                                # Lower = less CPU, higher = more accurate
Rtabmap/TimeThr: "0"            # Time limit for map update (0 = no limit)

# Memory management
Mem/IncrementalMemory: "true"   # Build map incrementally
Mem/InitWMWithAllNodes: "false" # Initialize working memory with all nodes
Mem/MemoryThr: "0"              # Memory threshold (0 = no limit)
                                # Set to positive value to limit memory (e.g., 300)

# ==============================================================================
# RGB-D Parameters
# ==============================================================================

# Graph optimization
RGBD/OptimizeFromGraphEnd: "false"      # Optimize from graph end
RGBD/NeighborLinkRefining: "true"       # Refine neighbor links
RGBD/ProximityBySpace: "true"           # Use spatial proximity
RGBD/OptimizeMaxError: "1.0"            # Max optimization error (meters)

# Node creation thresholds
RGBD/LinearUpdate: "0.05"       # Create new node if moved > 5cm
RGBD/AngularUpdate: "0.05"      # Create new node if rotated > 0.05 rad (~3 degrees)
                                # Increase for less nodes, decrease for more detail

# Loop closure
RGBD/ProximityPathMaxNeighbors: "10"    # Max neighbors for proximity detection

# ==============================================================================
# Registration Parameters (Point Cloud Alignment)
# ==============================================================================

# Strategy
Reg/Strategy: "1"               # 0=Visual, 1=ICP, 2=Visual+ICP
                                # Use ICP (1) for robust depth-based registration
Reg/Force3DoF: "false"          # Allow full 6DOF (false for drones)

# ==============================================================================
# ICP (Iterative Closest Point) Parameters
# ==============================================================================

Icp/VoxelSize: "0.05"           # Voxel size for downsampling (meters)
                                # 0.05 = 5cm, balance between speed and accuracy

Icp/MaxCorrespondenceDistance: "0.15"   # Max distance for point correspondences (meters)
                                        # Increase for less precise scans

Icp/PointToPlaneK: "5"          # K-nearest neighbors for point-to-plane
Icp/PointToPlaneRadius: "0.0"   # Radius for point-to-plane (0 = use K)
Icp/PointToPlane: "true"        # Use point-to-plane (vs point-to-point)

Icp/MaxTranslation: "2.0"       # Max translation between frames (meters)
                                # Prevent large jumps in registration

Icp/Epsilon: "0.001"            # Convergence epsilon
Icp/Iterations: "30"            # Max ICP iterations (20-50)
                                # More iterations = more accurate but slower

Icp/PM: "true"                  # Use libpointmatcher for ICP
Icp/PMOutlierRatio: "0.7"       # Outlier ratio for libpointmatcher

# ==============================================================================
# Grid Mapping Parameters
# ==============================================================================

Grid/FromDepth: "true"          # Generate grid from depth image
Grid/3D: "true"                 # Generate 3D occupancy grid

# Range limits
Grid/RangeMax: "5.0"            # Max sensor range (meters)
Grid/RangeMin: "0.4"            # Min sensor range (meters)
                                # Adjust based on OAK-D camera specs

# Grid resolution and filtering
Grid/CellSize: "0.05"           # Grid cell size (meters) - 5cm
Grid/ClusterRadius: "0.1"       # Cluster radius for obstacle detection
Grid/NoiseFilteringRadius: "0.05"           # Noise filtering radius
Grid/NoiseFilteringMinNeighbors: "5"        # Min neighbors for valid point

# Obstacle detection
Grid/GroundIsObstacle: "false"              # Treat ground as obstacle
Grid/MaxGroundHeight: "0.0"                 # Max ground height (meters)
Grid/MaxObstacleHeight: "2.0"               # Max obstacle height (meters)
Grid/NormalsSegmentation: "false"           # Use normal-based segmentation

# ==============================================================================
# Visual Features (for loop closure detection)
# ==============================================================================

# Feature extraction
Kp/MaxFeatures: "400"           # Max features to extract per frame
Kp/DetectorStrategy: "6"        # Feature detector: 0=SURF, 6=GFTT/BRIEF
                                # GFTT/BRIEF is fast and works well

# Visual matching
Vis/MinInliers: "15"            # Min inliers for visual matching
Vis/InlierDistance: "0.1"       # Max inlier distance (meters)

# ==============================================================================
# Optimization Parameters
# ==============================================================================

RGBD/OptimizeStrategy: "1"      # Graph optimization: 0=TORO, 1=g2o, 2=GTSAM
Optimizer/Strategy: "1"         # 1=g2o (recommended for most cases)
Optimizer/Iterations: "20"      # Optimization iterations
Optimizer/Epsilon: "0.00001"    # Convergence epsilon

# ==============================================================================
# Tuning Guide
# ==============================================================================

# For Better Performance (Lower CPU):
# - Decrease Rtabmap/DetectionRate (e.g., 1.0)
# - Increase RGBD/LinearUpdate and RGBD/AngularUpdate
# - Decrease Icp/Iterations (e.g., 20)
# - Decrease Kp/MaxFeatures (e.g., 200)

# For Better Accuracy (Higher CPU):
# - Increase Rtabmap/DetectionRate (e.g., 3.0)
# - Decrease RGBD/LinearUpdate and RGBD/AngularUpdate
# - Increase Icp/Iterations (e.g., 50)
# - Increase Kp/MaxFeatures (e.g., 600)

# For Larger Maps:
# - Set Mem/MemoryThr to positive value (e.g., 300 MB)
# - Increase Grid/CellSize (e.g., 0.1 for 10cm)
# - Decrease Kp/MaxFeatures

# For Indoor Environments:
# - Use Reg/Strategy: "1" (ICP)
# - Decrease Grid/RangeMax (e.g., 3.0)

# For Outdoor Environments:
# - Use Reg/Strategy: "2" (Visual+ICP)
# - Increase Grid/RangeMax (e.g., 10.0)
# - Increase Icp/MaxCorrespondenceDistance
